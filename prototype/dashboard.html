<title>Atom 业绩看板</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --intl:#2a78d6; --cn:#eb6834;
  --a1:#86b6ef; --a2:#3987e5; --a3:#184f95;
  --plus:#1baf7a; --progift:#86b6ef; --propaid:#2a78d6;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95; --seq7:#0d366b;
  --good:#0ca30c; --goodtext:#006300; --warn:#fab219; --crit:#d03b3b;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --intl:#3987e5; --cn:#d95926;
    --a1:#86b6ef; --a2:#5598e7; --a3:#1c5cab;
    --plus:#199e70; --progift:#86b6ef; --propaid:#3987e5;
    --good:#0ca30c; --goodtext:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --intl:#3987e5; --cn:#d95926;
  --a1:#86b6ef; --a2:#5598e7; --a3:#1c5cab;
  --plus:#199e70; --progift:#86b6ef; --propaid:#3987e5;
  --good:#0ca30c; --goodtext:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --accent:#3987e5;
}
*{box-sizing:border-box}
body{margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.55;}
.top{position:sticky; top:0; z-index:20; background:var(--page); border-bottom:1px solid var(--grid); padding:0 20px;}
.top-row{max-width:1240px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:12px 0 8px;}
.brand{font-size:16px; font-weight:700; letter-spacing:.01em;}
.brand small{font-weight:400; color:var(--muted); margin-left:8px; font-size:12px;}
.fresh{font-size:12px; color:var(--muted); margin-left:auto;}
.fresh .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--warn); margin-right:5px; vertical-align:1px;}
.seg{display:inline-flex; border:1px solid var(--grid); border-radius:8px; overflow:hidden;}
.seg button{border:0; background:transparent; color:var(--ink2); padding:5px 14px; font-size:13px; cursor:pointer;}
.seg button.on{background:var(--accent); color:#fff; font-weight:600;}
.seg button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
.tabs{max-width:1240px; margin:0 auto; display:flex; gap:2px; overflow-x:auto;}
.tabs button{border:0; background:transparent; color:var(--ink2); padding:9px 14px; font-size:13.5px;
  cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tabs button.on{color:var(--ink); font-weight:700; border-bottom-color:var(--accent);}
.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
main{max-width:1240px; margin:0 auto; padding:18px 20px 72px;}
.grid{display:grid; gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--ring); border-radius:10px; padding:14px 16px; min-width:0;}
.card h3{margin:0 0 2px; font-size:13px; font-weight:600; color:var(--ink2);}
.card .sub{font-size:11.5px; color:var(--muted); margin:0 0 8px;}
.kpi .val{font-size:26px; font-weight:600; margin:2px 0 0;}
.delta{font-size:12px; margin-left:8px; font-weight:500;}
.delta.up{color:var(--goodtext);} .delta.down{color:var(--crit);}
.kpi svg{display:block; margin-top:6px;}
.sec{margin:26px 0 10px; font-size:15px; font-weight:700;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin:4px 0 2px;}
.legend .it{display:inline-flex; align-items:center; gap:6px;}
.legend .sw{width:10px; height:10px; border-radius:3px; display:inline-block;}
.legend .ln{width:14px; height:2px; border-radius:1px; display:inline-block;}
figure{margin:0;} figcaption{font-size:11.5px; color:var(--muted); margin-top:6px;}
svg text{font-family:inherit;}
.tt{position:fixed; z-index:50; pointer-events:none; background:var(--surface); color:var(--ink);
  border:1px solid var(--ring); box-shadow:0 4px 14px rgba(0,0,0,.12); border-radius:8px;
  padding:8px 10px; font-size:12px; display:none; max-width:260px;}
.tt b{font-weight:600;} .tt .row{display:flex; align-items:center; gap:6px; margin-top:2px;}
.tt .sw{width:8px; height:8px; border-radius:2px;}
.tt .v{margin-left:auto; font-variant-numeric:tabular-nums; padding-left:12px;}
table.dt{border-collapse:collapse; width:100%; font-size:12.5px;}
.dt th{color:var(--ink2); font-weight:600; text-align:left; padding:6px 8px; border-bottom:1px solid var(--grid); white-space:nowrap;}
.dt td{padding:6px 8px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums;}
.dt td:first-child{font-variant-numeric:normal;}
.pill{display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; font-weight:600;}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent); color:var(--goodtext);}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--ink);}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,transparent); color:var(--crit);}
.alert{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--grid); font-size:13px;}
.alert:last-child{border-bottom:0;}
.alert .ic{font-size:14px; line-height:1.4;}
.funnel{display:flex; gap:0; align-items:stretch; overflow-x:auto; padding:4px 0;}
.fstage{flex:1; min-width:118px; padding:10px 12px; border:1px solid var(--grid); border-left:0; position:relative;}
.fstage:first-child{border-left:1px solid var(--grid); border-radius:8px 0 0 8px;}
.fstage:last-child{border-radius:0 8px 8px 0;}
.fstage .n{font-size:12px; color:var(--ink2);}
.fstage .v{font-size:19px; font-weight:600; margin:2px 0;}
.fstage .r{font-size:11.5px; color:var(--muted);}
.fstage .bar{height:5px; border-radius:3px; background:var(--seq2); margin-top:6px; overflow:hidden;}
.fstage .bar i{display:block; height:100%; background:var(--accent); border-radius:3px;}
.note{font-size:12px; color:var(--muted);}
.krow{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--grid);}
.krow:last-child{border-bottom:0}
.krow .kl{font-size:12.5px;color:var(--ink2);flex:1;min-width:0}
.krow .kl small{display:block;color:var(--muted);font-size:10.5px}
.krow .kv{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
footer{max-width:1240px; margin:30px auto 0; padding:14px 20px; color:var(--muted); font-size:12px; border-top:1px solid var(--grid);}
.hide{display:none !important;}
a{color:var(--accent);}
</style>

<div class="top">
  <div class="top-row">
    <span class="brand">Atom 业绩看板<small>原型 · 模拟数据</small></span>
    <span class="seg" id="plSeg" role="group" aria-label="产品线筛选">
      <button data-pl="all" class="on">全部</button><button data-pl="intl">国际版</button><button data-pl="cn">中国版</button>
    </span>
    <span class="fresh"><span class="dot"></span>数据截至 2026-08-17（PT）｜开机活跃近 7 日未定稿</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="ov" class="on">总览</button><button data-t="act">激活</button>
    <button data-t="eng">活跃</button><button data-t="ret">留存</button>
    <button data-t="wk">训练</button><button data-t="mem">会员</button><button data-t="dev">设备健康</button>
  </nav>
</div>
<main id="main"></main>
<footer>Atom 业绩看板原型 v1 ｜ 全部数据为演示用模拟数据（2026-04 → 2026-08）｜ 口径：<i>atom-data-dictionary.md v1.1</i> ｜ 图内编号（ACT-08、SUB-06…）对应数据字典 v1.1 条目；标注"二期"的模块待外部接口。颜色约定：国际版=蓝 · 中国版=橙 · 活跃层级=蓝色由浅至深 · Pro 付费/赠送=同蓝两档 · Plus=青绿。</footer>
<div class="tt" id="tt"></div>

<script>
'use strict';
/* ---------- seeded mock data ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}}
const WK=[];{ // ISO weeks W14(2026-03-30) .. W33(2026-08-10)
  const d=new Date(Date.UTC(2026,2,30));
  for(let i=14;i<=33;i++){WK.push({label:'W'+i,date:new Date(d)});d.setUTCDate(d.getUTCDate()+7);}
}
const NW=WK.length;
function series(seed,base,growth,noise){const r=rng(seed);return WK.map((_,i)=>Math.round(base*Math.pow(1+growth,i)*(1+(r()-.5)*noise)));}
const D={
  intl:{newAct:series(11,420,.085,.22)},
  cn:  {newAct:series(21,260,.075,.28)},
};
for(const k of ['intl','cn']){
  const d=D[k], r=rng(k==='intl'?31:41);
  d.cum=[]; let c=(k==='intl'?2600:1700);
  d.newAct.forEach(v=>{c+=v; d.cum.push(c);});
  d.wau1=d.cum.map((c,i)=>Math.round(c*(0.60-0.006*i)*(1+(r()-.5)*.06)));   // power-on WAU share slowly declining
  d.wau2=d.wau1.map(v=>Math.round(v*(0.90+(r()-.5)*.03)));
  d.wau3=d.wau2.map(v=>Math.round(v*(0.56+(r()-.5)*.05)));
  d.plus=d.cum.map(c=>Math.round(c*0.93));
  d.proGift=d.cum.map((c,i)=>Math.round(d.newAct.slice(Math.max(0,i-12),i+1).reduce((a,b)=>a+b,0)*0.78));
  d.proPaid=[]; let p=(k==='intl'?260:120);
  d.newAct.forEach((v,i)=>{p+=Math.round(v*0.055+ (i>6? d.proGift[i]*0.012:0)); p=Math.round(p*0.995); d.proPaid.push(p);});
  d.sess=d.wau3.map(v=>({W:Math.round(v*1.1),M:Math.round(v*1.6),m:Math.round(v*2.1)}));
}
const SUM=a=>a.reduce((x,y)=>x+y,0);
function pick(pl){ // returns metric accessor combining regions
  const g=(f)=>WK.map((_,i)=> pl==='all'? f(D.intl)[i]+f(D.cn)[i] : f(D[pl])[i]);
  return {newAct:g(d=>d.newAct),cum:g(d=>d.cum),wau1:g(d=>d.wau1),wau2:g(d=>d.wau2),wau3:g(d=>d.wau3),
    plus:g(d=>d.plus),proGift:g(d=>d.proGift),proPaid:g(d=>d.proPaid),
    sessW:g(d=>d.sess.map(s=>s.W)),sessM:g(d=>d.sess.map(s=>s.M)),sessm:g(d=>d.sess.map(s=>s.m))};
}
// weekly cohort retention (A3), 12 cohorts x W0..W8
const COH=[];{const r=rng(77);
  for(let c=0;c<12;c++){const row=[];const base=0.62+c*0.008;
    for(let w=0;w<=8;w++){ if(c+w>=12+2) {row.push(null);continue;}
      let v=w===0?base: base*Math.pow(0.80,Math.min(w,3))*Math.pow(0.965,Math.max(0,w-3));
      row.push(Math.max(.14,v*(1+(r()-.5)*.08)));}
    COH.push({label:'W'+(22+c),n:Math.round(500+r()*700),row});}
}
const COHM=[];{const r=rng(88);const ms=['4 月','5 月','6 月','7 月','8 月'];
  for(let c=0;c<5;c++){const row=[];const base=0.60+c*0.012;
    for(let m=0;m<=4;m++){ if(c+m>4){row.push(null);continue;}
      let v=m===0?base:base*Math.pow(0.62,Math.min(m,1))*Math.pow(0.90,Math.max(0,m-1));
      row.push(Math.max(.12,v*(1+(r()-.5)*.06)));}
    COHM.push({label:ms[c],n:Math.round(2200+c*700+r()*400),row});}
}
const QR = WK.map((_,i)=>Math.max(.9,1.55-0.021*i+ (rng(55+i)()-.5)*.1));
const FREQ={labels:['0','1','2','3','4','5+'],vals:[38,22,16,11,7,6]};
const GIFT={labels:['赠 1 个月','赠 3 个月','赠 6 个月','赠 12 个月'],conv:[12,22,31,38],n:[1840,2620,1310,540]};
const AIH={labels:['0–20%','20–40%','40–60%','60–80%','80–99%','触顶'],plus:[41,23,14,9,7,6],pro:[18,20,22,18,13,9]};
const SEG={labels:WK.slice(8).map(w=>w.label),
  power:[9,9,10,10,10,11,11,11,12,12,12,12],regular:[24,24,25,25,26,26,26,27,27,27,26,26],
  light:[27,27,27,26,26,26,25,25,25,24,24,24],dormant:[22,22,21,21,21,20,21,21,20,21,21,22],
  churn:[18,18,17,18,17,17,17,16,16,16,17,16]};
const FW={labels:['v2.4.0','v2.4.1','v2.5.0','v2.5.1(新)'],vals:[6,14,31,49]};
const DELAY={labels:['<1 分','1–60 分','1–24 时','1–3 天','3–7 天','>7 天(丢弃)'],vals:[61,17,12,6,3,1]};

/* ---------- tiny chart lib ---------- */
const NS='http://www.w3.org/2000/svg';
const fmt=n=>n>=10000?(n/1000).toFixed(1)+'K':(''+Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const pct=v=>Math.round(v*100)+'%';
const tt=document.getElementById('tt');
function showTT(html,x,y){tt.innerHTML=html;tt.style.display='block';
  const w=tt.offsetWidth,h=tt.offsetHeight;
  tt.style.left=Math.min(x+14,innerWidth-w-8)+'px';
  tt.style.top=Math.max(8,Math.min(y-h-10,innerHeight-h-8))+'px';}
function hideTT(){tt.style.display='none';}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;}
function cvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function lineChart(host,{labels,series,h=190,yFmt=fmt,fill=false,ymax=null}){
  host.innerHTML='';const W=host.clientWidth||560,H=h,pl=44,pr=10,pt=10,pb=22;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img'},host);
  const all=series.flatMap(s=>s.data).filter(v=>v!=null);
  const mx=ymax||Math.max(...all)*1.08, mn=0;
  const x=i=>pl+(W-pl-pr)*i/(labels.length-1), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  for(let g=0;g<=3;g++){const gy=pt+(H-pt-pb)*g/3;
    el('line',{x1:pl,x2:W-pr,y1:gy,y2:gy,stroke:cvar('--grid'),'stroke-width':1},svg);
    el('text',{x:pl-6,y:gy+4,'text-anchor':'end','font-size':10,fill:cvar('--muted')},svg)
      .textContent=yFmt(mx-(mx-mn)*g/3);}
  const step=Math.ceil(labels.length/8);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)
    el('text',{x:x(i),y:H-6,'text-anchor':'middle','font-size':10,fill:cvar('--muted')},svg).textContent=l;});
  series.forEach(s=>{
    const col=cvar(s.color);
    const pts=s.data.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(fill){const dA='M'+pts.map(p=>p.join(',')).join('L')+`L${pts[pts.length-1][0]},${H-pb}L${pts[0][0]},${H-pb}Z`;
      el('path',{d:dA,fill:col,opacity:.10},svg);}
    el('path',{d:'M'+pts.map(p=>p.join(',')).join('L'),fill:'none',stroke:col,
      'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    const lp=pts[pts.length-1];
    el('circle',{cx:lp[0],cy:lp[1],r:4,fill:col,stroke:cvar('--surface'),'stroke-width':2},svg);
  });
  const cross=el('line',{x1:0,x2:0,y1:pt,y2:H-pb,stroke:cvar('--axis'),'stroke-width':1,opacity:0},svg);
  const cap=el('rect',{x:pl,y:pt,width:W-pl-pr,height:H-pt-pb,fill:'transparent'},svg);
  cap.addEventListener('mousemove',ev=>{
    const r=host.getBoundingClientRect(),sx=W/r.width;
    const i=Math.max(0,Math.min(labels.length-1,Math.round(((ev.clientX-r.left)*sx-pl)/((W-pl-pr)/(labels.length-1)))));
    cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('opacity',.7);
    showTT(`<b>${labels[i]}</b>`+series.map(s=>`<div class="row"><span class="sw" style="background:${cvar(s.color)}"></span>${s.name}<span class="v">${s.data[i]==null?'—':yFmt(s.data[i])}</span></div>`).join(''),ev.clientX,ev.clientY);
  });
  cap.addEventListener('mouseleave',()=>{cross.setAttribute('opacity',0);hideTT();});
}
function stackChart(host,{labels,series,h=190,asPct=false,yFmt=fmt}){
  host.innerHTML='';const W=host.clientWidth||560,H=h,pl=44,pr=10,pt=10,pb=22;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img'},host);
  const totals=labels.map((_,i)=>SUM(series.map(s=>s.data[i])));
  const mx=asPct?100:Math.max(...totals)*1.08;
  const bw=Math.min(24,(W-pl-pr)/labels.length-3);
  const x=i=>pl+(W-pl-pr)*(i+.5)/labels.length, y=v=>pt+(H-pt-pb)*(1-v/mx);
  for(let g=0;g<=3;g++){const gy=pt+(H-pt-pb)*g/3;
    el('line',{x1:pl,x2:W-pr,y1:gy,y2:gy,stroke:cvar('--grid'),'stroke-width':1},svg);
    el('text',{x:pl-6,y:gy+4,'text-anchor':'end','font-size':10,fill:cvar('--muted')},svg)
      .textContent=(asPct?Math.round(mx-mx*g/3)+'%':yFmt(mx-mx*g/3));}
  const step=Math.ceil(labels.length/10);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)
    el('text',{x:x(i),y:H-6,'text-anchor':'middle','font-size':10,fill:cvar('--muted')},svg).textContent=l;});
  labels.forEach((l,i)=>{
    let acc=0;
    series.forEach((s,si)=>{
      const raw=s.data[i], v=asPct? raw/totals[i]*100 : raw;
      const y1=y(acc+v), hh=Math.max(0,y(acc)-y(acc+v)-(si<series.length-1?2:0));
      const rc=el('rect',{x:x(i)-bw/2,y:y1,width:bw,height:Math.max(hh,0),fill:cvar(s.color),rx:si===series.length-1?4:0},svg);
      rc.addEventListener('mousemove',ev=>showTT(`<b>${l} · ${s.name}</b><div class="row"><span class="v">${asPct?Math.round(raw/totals[i]*100)+'%':yFmt(raw)}</span></div>`,ev.clientX,ev.clientY));
      rc.addEventListener('mouseleave',hideTT);
      acc+=v;});
  });
}
function barH(host,{labels,vals,color='--accent',suffix='%',max=null,h=null,note=null}){
  host.innerHTML='';const W=host.clientWidth||560,rowH=30,H=h||labels.length*rowH+8;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img'},host);
  const lw=Math.min(120,W*.28), mx=max||Math.max(...vals)*1.15;
  labels.forEach((l,i)=>{const yy=i*rowH+8;
    el('text',{x:lw-8,y:yy+13,'text-anchor':'end','font-size':11.5,fill:cvar('--ink2')},svg).textContent=l;
    el('rect',{x:lw,y:yy,width:(W-lw-56)*Math.min(1,vals[i]/mx),height:18,rx:4,fill:cvar(color)},svg);
    el('text',{x:lw+(W-lw-56)*Math.min(1,vals[i]/mx)+8,y:yy+13,'font-size':11.5,fill:cvar('--ink')},svg)
      .textContent=vals[i]+suffix+(note?` · ${note[i]}`:'');});
}
function heatmap(host,{rows,cols,title}){
  host.innerHTML='';const W=host.clientWidth||560;
  const lw=64,cw=Math.min(56,(W-lw-40)/cols.length),ch=26;
  const H=(rows.length+1)*ch+14;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img'},host);
  const ramp=['--seq1','--seq2','--seq3','--seq4','--seq5','--seq6','--seq7'];
  cols.forEach((c,j)=>el('text',{x:lw+cw*j+cw/2,y:14,'text-anchor':'middle','font-size':10.5,fill:cvar('--muted')},svg).textContent=c);
  rows.forEach((r,i)=>{
    const yy=(i+1)*ch+4;
    el('text',{x:lw-8,y:yy+ch/2+4,'text-anchor':'end','font-size':11,fill:cvar('--ink2')},svg).textContent=r.label;
    r.row.forEach((v,j)=>{
      if(v==null)return;
      const small=r.n<100;
      const idx=Math.min(ramp.length-1,Math.floor(v*ramp.length));
      const rc=el('rect',{x:lw+cw*j+1,y:yy+1,width:cw-2,height:ch-2,rx:3,
        fill:small?cvar('--grid'):cvar(ramp[idx]),opacity:small?.6:1},svg);
      const dark=idx>=3&&!small;
      if(cw>=40)el('text',{x:lw+cw*j+cw/2,y:yy+ch/2+4,'text-anchor':'middle','font-size':10,
        fill:small?cvar('--muted'):(dark?'#fff':cvar('--ink')),'pointer-events':'none'},svg).textContent=Math.round(v*100);
      rc.addEventListener('mousemove',ev=>showTT(`<b>cohort ${r.label} · ${cols[j]}</b><div class="row">A3 运动留存<span class="v">${Math.round(v*100)}%</span></div><div class="row">样本<span class="v">${fmt(r.n)}${small?'（<100 灰显）':''}</span></div>`,ev.clientX,ev.clientY));
      rc.addEventListener('mouseleave',hideTT);
    });
  });
}
function spark(host,data,color){
  const W=120,H=30;host.innerHTML='';
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,'aria-hidden':'true'},host);
  const mx=Math.max(...data),mn=Math.min(...data);
  const x=i=>2+(W-4)*i/(data.length-1), y=v=>3+(H-8)*(1-(v-mn)/((mx-mn)||1));
  el('path',{d:'M'+data.map((v,i)=>`${x(i)},${y(v)}`).join('L'),fill:'none',
    stroke:cvar(color||'--accent'),'stroke-width':1.6,'stroke-linecap':'round'},svg);
  el('circle',{cx:x(data.length-1),cy:y(data[data.length-1]),r:3,fill:cvar(color||'--accent'),
    stroke:cvar('--surface'),'stroke-width':1.5},svg);
}
